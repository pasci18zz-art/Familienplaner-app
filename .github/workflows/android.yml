name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Version festlegen
        id: ver
        run: |
          NAME="$(node -p "require('./package.json').version").${GITHUB_RUN_NUMBER}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME"

      - name: Web-App bauen
        run: |
          npm ci
          npm run build
        env:
          APP_VERSION: ${{ steps.ver.outputs.name }}

      - name: Signierschlüssel vorbereiten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "HAS_RELEASE_KEY=1" >> "$GITHUB_ENV"
          else
            echo "USE_DEBUG_SIGNING=1" >> "$GITHUB_ENV"
          fi

      # Ohne eigene Secrets: Debug-Schlüssel zwischenspeichern, damit Updates installierbar bleiben.
      - name: Gespeicherten Schlüssel laden
        id: dk
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: familienplaner-debug-keystore-v1

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}

      - name: APK bauen
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$HAS_RELEASE_KEY" = "1" ]; then
            ./gradlew --no-daemon assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="${KEY_ALIAS:-familienplaner}" \
              -Pandroid.injected.signing.key.password="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            ./gradlew --no-daemon assembleRelease
          fi
          rm -f "$RUNNER_TEMP/release.jks"
          cp app/build/outputs/apk/release/app-release.apk ../Familienplaner.apk

      # Sofort speichern (nicht erst am Ende), damit der Schlüssel auch erhalten bleibt,
      # wenn das Veröffentlichen danach an GitHub-Störungen scheitert.
      - name: Schlüssel speichern
        if: steps.dk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: familienplaner-debug-keystore-v1

      - uses: actions/upload-artifact@v4
        with:
          name: Familienplaner-${{ steps.ver.outputs.name }}
          path: Familienplaner.apk

      - name: Als "Neueste Version" veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4; do
            gh release delete neueste-version -y --cleanup-tag || true
            if gh release create neueste-version Familienplaner.apk \
              --title "Familienplaner – neueste Version (${{ steps.ver.outputs.name }})" \
              --notes "Automatisch gebaut am $(date +'%d.%m.%Y %H:%M') aus ${{ github.ref_name }}. Auf dem Handy oder Tablet die Datei Familienplaner.apk herunterladen und installieren." \
              --latest \
              --target ${{ github.sha }}; then
              exit 0
            fi
            sleep $((i * 10))
          done
          exit 1
